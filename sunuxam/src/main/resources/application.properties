
spring.application.name=SunuXam

spring.datasource.url=${SUNUXAM_DB_URL:jdbc:postgresql://localhost:5432/sunuxam}
spring.datasource.username=${SUNUXAM_DB_UTILISATEUR:sunuxam}
spring.datasource.password=${SUNUXAM_DB_MOT_DE_PASSE:sunuxam}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=${SUNUXAM_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${SUNUXAM_DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=SunuXamHikariPool

spring.jpa.hibernate.ddl-auto=${SUNUXAM_JPA_DDL:update}
spring.jpa.show-sql=${SUNUXAM_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SUNUXAM_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always


spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Dakar


sunuxam.securite.jwt.cle-secrete=${SUNUXAM_JWT_SECRET:changez-cette-cle-secrete-de-developpement-32-octets-minimum}
sunuxam.securite.jwt.duree-validite-ms=${SUNUXAM_JWT_DUREE_MS:86400000}
sunuxam.securite.jwt.emetteur=${SUNUXAM_JWT_EMETTEUR:sunuxam}


sunuxam.admin-initial.creation-automatique=${SUNUXAM_ADMIN_INIT:true}
sunuxam.admin-initial.nom=${SUNUXAM_ADMIN_NOM:Administrateur}
sunuxam.admin-initial.prenom=${SUNUXAM_ADMIN_PRENOM:SunuXam}
sunuxam.admin-initial.email=${SUNUXAM_ADMIN_EMAIL:admin@sunuxam.sn}
sunuxam.admin-initial.mot-de-passe=${SUNUXAM_ADMIN_MOT_DE_PASSE:Admin@123456}


springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


logging.level.root=INFO
logging.level.com.sunuxam=${SUNUXAM_LOG_NIVEAU:DEBUG}
logging.level.org.hibernate.SQL=${SUNUXAM_LOG_SQL:DEBUG}
