
spring.datasource.url=jdbc:h2:mem:sunuxam-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Secret JWT deterministe pour les tests
sunuxam.securite.jwt.cle-secrete=cle-secrete-de-test-uniquement-32-octets-minimum-ok
sunuxam.securite.jwt.duree-validite-ms=3600000
sunuxam.securite.jwt.emetteur=sunuxam-test

# Pas de creation automatique d'administrateur pendant les tests
sunuxam.admin-initial.creation-automatique=false
sunuxam.admin-initial.nom=Administrateur
sunuxam.admin-initial.prenom=Test
sunuxam.admin-initial.email=admin@test.local
sunuxam.admin-initial.mot-de-passe=AdminTest123

logging.level.com.sunuxam=INFO
logging.level.org.hibernate.SQL=WARN
